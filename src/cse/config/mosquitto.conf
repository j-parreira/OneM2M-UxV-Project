# mosquitto.conf — Eclipse Mosquitto MQTT broker configuration
#
# Minimal config for the UxV benchmark:
#   - Listen on all interfaces, port 1883
#   - Anonymous access (no auth required) — lab/LAN use only
#   - No TLS, no persistence (messages are transient per benchmark run)
#
# SECURITY NOTE: allow_anonymous=true is intentional for a controlled
# lab environment. Do NOT use this config on a public network.

listener 1883
allow_anonymous true
