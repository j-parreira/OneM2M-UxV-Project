;
; acme.ini — ACME oneM2M CSE configuration for UxV Benchmark
;
; IMPORTANT: Section names must be exactly as written here.
;   [http]      NOT [server.http]
;   [mqtt]      NOT [server.mqtt]
;   [websocket] NOT [server.websocket]
;   [coap]      NOT [server.coap]
;
; This file is mounted as a volume into the container at /data/acme.ini.
; Edit it and restart the container — no image rebuild needed.
;   docker compose restart acme-cse
;

; ── Shared configuration variables ──────────────────────────────────────────
; These are referenced via ${basic.config:key} in other sections.
[basic.config]
cseType          = IN
cseID            = id-in
cseName          = cse-in
adminID          = CAdmin
networkInterface = 0.0.0.0
cseHost          = ${hostIPAddress}
httpPort         = 8080
logLevel         = info
databaseType     = tinydb
consoleTheme     = light


; ── HTTP binding ─────────────────────────────────────────────────────────────
[http]
port             = ${basic.config:httpPort}
listenIF         = ${basic.config:networkInterface}
address          = http://${basic.config:cseHost}:${basic.config:httpPort}
; Enables GET /onem2m/~ for resource tree inspection (useful for debugging)
enableManagementEndpoint = true


; ── MQTT binding ─────────────────────────────────────────────────────────────
; ACME CSE is an MQTT CLIENT — it connects to the Mosquitto broker.
; "mosquitto" is the Docker Compose service name (resolved via internal DNS).
[mqtt]
enable           = true
address          = mosquitto
port             = 1883


; ── WebSocket binding ─────────────────────────────────────────────────────────
; Android app connects to ws://HOST:8180
; Port 8180 avoids conflict with host :80
[websocket]
enable           = true
port             = 8180
listenIF         = 0.0.0.0
address          = ws://${basic.config:cseHost}:8180


; ── CoAP binding ──────────────────────────────────────────────────────────────
; UDP — docker-compose must expose 5683/udp explicitly (easy to miss)
[coap]
enable           = true
port             = 5683
listenIF         = ${basic.config:networkInterface}
address          = coap://${basic.config:cseHost}:5683


; ── Database (TinyDB — file-based, no external DB needed) ────────────────────
[database]
type             = ${basic.config:databaseType}

[database.tinydb]
; /data/db is a named Docker volume — persists across container restarts
path             = /data/db


; ── AE registration policy ──────────────────────────────────────────────────
; Allow AEs whose originator starts with C or S (standard oneM2M prefixes).
; Android app uses "C" + droneSerialNumber as originator.
[cse.registration]
allowedAEOriginators  = C*,S*,/id-in/C*
allowedCSROriginators = /id-mn


; ── Text UI (disable for headless Docker operation) ──────────────────────────
[textui]
startWithTUI     = False
