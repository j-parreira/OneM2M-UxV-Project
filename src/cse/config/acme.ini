;
; acme.ini — ACME oneM2M CSE v2025.11 configuration for UxV Benchmark
;
; IMPORTANT: Section names must be exactly as written here.
;   [http]      NOT [server.http]
;   [mqtt]      NOT [server.mqtt]
;   [websocket] NOT [server.websocket]
;   [coap]      NOT [server.coap]
;
; This file is mounted as a volume at /data/acme.ini.
; Edit and restart without image rebuild:
;   docker compose restart acme-cse
;
; Clean restart (resets TinyDB — needed after changing cseID or serviceProviderID):
;   docker compose down -v && docker compose up
;

; ── Shared configuration variables ──────────────────────────────────────────
; Referenced via ${basic.config:key} throughout the file.
[basic.config]
cseType           = IN
cseID             = id-in
cseName           = cse-in
; Service provider ID — affects TinyDB filename in v2025.11:
;   resources-{serviceProviderID}-{cseID}.json
serviceProviderID = //uxv.benchmark
adminID           = CAdmin
; Data directory — resolves relative paths in cert/log paths
; With -dir /data, ${baseDirectory} = /data
dataDirectory     = ${baseDirectory}
networkInterface  = 0.0.0.0
cseHost           = ${hostIPAddress}
httpPort          = 8080
logLevel          = info
databaseType      = tinydb
consoleTheme      = light


; ── CSE operational settings ─────────────────────────────────────────────────
[cse]
; Default serialisation for requests/responses
defaultSerialization = json
; Async notifications: don't block subscription creation while notifying
asyncSubscriptionNotifications = true
; Send verification NOTIFY when subscription is created.
; The Android app's sendNotifyAck() handles this correctly (ACKs op=5).
enableSubscriptionVerificationRequests = true


; ── HTTP binding ─────────────────────────────────────────────────────────────
[http]
port             = ${basic.config:httpPort}
listenIF         = ${basic.config:networkInterface}
address          = http://${basic.config:cseHost}:${basic.config:httpPort}
; Management endpoint — enables GET /id-in/~mgmt for operational inspection
enableManagementEndpoint = true


; ── MQTT binding ─────────────────────────────────────────────────────────────
; ACME CSE is an MQTT CLIENT — connects to the Mosquitto broker.
; "mosquitto" resolves via Docker Compose internal DNS.
;
; MQTT topic structure (needed for Android MqttProtocolClient):
;   AE → CSE request:  /oneM2M/req/{originator}/{cseID}/json
;   CSE → AE response: /oneM2M/resp/{cseID}/{originator}/json
;   AE registration:   /oneM2M/reg_req/{originator}/{cseID}/json
;   CSE notification:  /oneM2M/req/{cseID}/{originator}/json  ← AE subscribes here
[mqtt]
enable           = true
address          = mosquitto
port             = 1883
; keepalive=60 is the default — increase if RC WiFi is unstable
keepalive        = 60

; MQTT over WebSocket (v2025.11 new feature) — for future use
; When enabled, MQTT protocol is accessible via WebSocket on a separate port.
; Useful for clients that can only use WebSocket but want MQTT semantics.
; [mqtt.websocket]
; enable = false
; port   = 9001


; ── WebSocket binding ─────────────────────────────────────────────────────────
; Android app connects to ws://HOST:8180
; Notifications are delivered on the SAME connection as the originator.
; The subscription nu field MUST be the AE originator (e.g. "C3LKFD12ABC"),
; NOT the AE resource URI ("/id-in/uxv"). ACME CSE associates WS connections
; by originator — wrong nu = subscription created but no notifications delivered.
[websocket]
enable           = true
port             = 8180
listenIF         = 0.0.0.0
address          = ws://${basic.config:cseHost}:8180


; ── CoAP binding ──────────────────────────────────────────────────────────────
; UDP — docker-compose must expose 5683/udp explicitly or CoAP silently fails.
; NOTE: DTLS (Datagram TLS for CoAP) is NOT yet fully implemented in v2025.11.
;       Use useDTLS=false (default). Do not configure certs for CoAP.
[coap]
enable                 = true
port                   = 5683
listenIF               = ${basic.config:networkInterface}
address                = coap://${basic.config:cseHost}:5683
; Connection cache for repeated clients (benchmark generates many connections)
clientConnectionCacheSize = 200


; ── Database (TinyDB — file-based, no external DB needed) ────────────────────
[database]
type             = ${basic.config:databaseType}

[database.tinydb]
; /data/db is a named Docker volume — persists across container restarts
path             = /data/db
; writeDelay=10 recommended by ACME CSE for Docker — batches writes to reduce I/O
writeDelay       = 10


; ── AE registration policy ──────────────────────────────────────────────────
; Android app uses "C" + droneSerialNumber as originator (e.g. "C3LKFD12ABC")
; /id-in/C* covers CSE-relative originators from the same CSE
[cse.registration]
allowedAEOriginators  = C*,S*,/id-in/C*
allowedCSROriginators = /id-mn


; ── Security — Access Control ─────────────────────────────────────────────────
; enableACPChecks=false disables all oneM2M access control checks.
; INTENTIONAL for a controlled lab/benchmark environment where all participants
; are trusted (Android app, Streamlit, test scripts).
; Do NOT disable in production or multi-tenant deployments.
[cse.security]
enableACPChecks  = false


; ── Text UI (disable — required for headless Docker) ─────────────────────────
[textui]
startWithTUI     = False
